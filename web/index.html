<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장 사진 보드판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one column on the phone (capture form → preview), wide photo grid grouped by date on the PC */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#1b1f1d; --muted:#5f6862; --line:#d5d9d4;
  --accent:#1f5b46; --accent-ink:#ffffff; --warn:#b3261e; --chip:#e6ebe7;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201d; --ink:#e7ebe8; --muted:#9aa49e; --line:#2f3732;
  --accent:#5fb791; --accent-ink:#0d1712; --warn:#f2867c; --chip:#25302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --ink:#e7ebe8; --muted:#9aa49e; --line:#2f3732;
  --accent:#5fb791; --accent-ink:#0d1712; --warn:#f2867c; --chip:#25302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--sans);padding:8px 16px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* capture */
.cap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cap{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--surface);border:2px solid var(--ink);border-radius:4px}
.board .row{display:grid;grid-template-columns:72px minmax(0,1fr);border-top:1px solid var(--ink)}
.board .row:first-child{border-top:0}
.board label{font-weight:700;padding:10px 8px;border-right:1px solid var(--ink);display:flex;align-items:center;letter-spacing:.08em}
.board input{border:0;background:transparent;color:var(--ink);font:700 16px var(--sans);padding:10px;width:100%;min-width:0}
.board input::placeholder{color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:13px;margin:8px 2px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--sans);padding:12px 18px;border-radius:10px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{flex:1 1 100%;font-size:17px;min-height:56px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.preview{background:var(--surface);border:1px dashed var(--line);border-radius:12px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:12px}
.preview canvas{max-width:100%;height:auto;border-radius:6px;display:block}
.preview .empty{color:var(--muted);text-align:center;font-size:14px;max-width:32ch}
.status{font-size:14px;font-weight:600;min-height:21px}
.status.ok{color:var(--accent)} .status.err{color:var(--warn)}
.recent{margin-top:6px;font-size:13px;color:var(--muted)}

/* gallery */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{font:500 14px var(--sans);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.filters input{flex:1 1 180px}
.count{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.day{margin-top:18px}
.day h2{font:500 14px var(--mono);color:var(--muted);margin:0 0 8px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--ink);display:flex;flex-direction:column}
.card .open{border:0;padding:0;background:none;cursor:pointer;display:block;width:100%}
.card .note{padding:0 10px 6px;font-size:13px;font-weight:600;overflow-wrap:anywhere}
.act{display:flex;align-items:center;gap:6px}
.card .act{padding:0 10px 10px;margin-top:auto}
.act-label{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.ox{width:38px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:800 16px var(--mono);border-radius:6px;cursor:pointer}
.ox:disabled{cursor:default;opacity:.6}
.ox-O[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ox-X[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.card .meta{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.chip{background:var(--chip);border-radius:4px;padding:1px 7px;font-weight:600}
.card .where{color:var(--muted)}
.emptylist{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
.emptylist strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,11,.86);display:flex;flex-direction:column;z-index:10;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb .imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.lb .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px}
.lb .info{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;min-width:0}
.lb .bar .btns{display:flex;gap:8px;flex-wrap:wrap}
.lb .btn{min-height:40px;padding:8px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.card .open img{transition:opacity .12s}.card .open:hover img{opacity:.88}}

/* login */
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h2{margin:0;font-size:18px}
.login p{margin:0;color:var(--muted);font-size:14px}
.login input{font:500 16px var(--sans);padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--muted);font:500 13px var(--sans);cursor:pointer;padding:6px;text-decoration:underline}
.prog{width:100%;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<div class="wrap" id="login-view" hidden>
  <form class="login" id="login-form">
    <h2>현장 사진 보드판</h2>
    <p>팀 비밀번호를 입력하세요. 한 번 입력하면 이 기기에서는 계속 유지돼요.</p>
    <input id="lg-pw" type="password" autocomplete="current-password" placeholder="팀 비밀번호" required>
    <button class="btn primary" id="lg-btn" type="submit">로그인</button>
    <div class="status err" id="lg-err" role="status"></div>
  </form>
</div>
<div class="wrap" id="boot"><p class="hint">불러오는 중…</p></div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <h1>현장 사진 보드판</h1>
    <div class="hdr-right">
    <div class="tabs" role="tablist">
      <button id="tab-cap" role="tab" aria-selected="true">촬영</button>
      <button id="tab-list" role="tab" aria-selected="false">사진 목록</button>
    </div>
    <button class="linkbtn" id="btn-logout">로그아웃</button>
    </div>
  </header>

  <section id="view-cap">
    <div class="cap">
      <div>
        <div class="board" id="board">
          <div class="row"><label for="f-name">공사명</label><input id="f-name" list="dl-name" placeholder="의왕 월암 A-1BL 아파트 건설공사"></div>
          <div class="row"><label for="f-dong">위 치</label><input id="f-dong" list="dl-dong" placeholder="101동"></div>
          <div class="row"><label for="f-floor">층</label><input id="f-floor" list="dl-floor" placeholder="2202" inputmode="numeric"></div>
          <div class="row"><label for="f-work">공종</label><input id="f-work" list="dl-work" placeholder="타일"></div>
          <div class="row"><label for="f-date">일 자</label><input id="f-date" type="date"></div>
          <div class="row"><label for="f-room">실</label><input id="f-room" list="dl-room" placeholder="공용욕실"></div>
          <div class="row"><label for="f-note">내 용</label><input id="f-note" list="dl-note" placeholder="예: 타일 줄눈 불량"></div>
        </div>
        <p class="hint">입력한 내용은 이 기기에 기억돼서 다음 촬영 때 그대로 채워져요. 일자는 매일 오늘 날짜로 바뀝니다.</p>
        <div class="actions">
          <button class="btn primary big" id="btn-shoot">📷 사진 찍기</button>
          <button class="btn" id="btn-pick">앨범에서 고르기</button>
        </div>
        <input type="file" id="in-camera" accept="image/*" capture="environment" hidden>
        <input type="file" id="in-pick" accept="image/*" multiple hidden>
      </div>
      <div class="preview" id="preview">
        <p class="empty" id="prev-empty">사진을 찍으면 보드판이 오른쪽 아래에 들어간 미리보기가 여기 나와요. 확인 후 올리기를 누르면 PC 사진 목록에 바로 올라갑니다.</p>
        <canvas id="canvas" hidden></canvas>
        <div class="actions" id="prev-actions" hidden>
          <button class="btn primary" id="btn-upload">올리기</button>
          <button class="btn" id="btn-retake">다시 찍기</button>
        </div>
        <div class="prog" id="prog" hidden><i id="prog-bar"></i></div>
        <div class="status" id="status" role="status"></div>
      </div>
    </div>
  </section>

  <section id="view-list" hidden>
    <div class="filters">
      <select id="flt-dong" aria-label="동"><option value="">전체 동</option></select>
      <select id="flt-work" aria-label="공종"><option value="">전체 공종</option></select>
      <select id="flt-date" aria-label="일자"><option value="">전체 일자</option></select>
      <select id="flt-act" aria-label="조치"><option value="">조치 전체</option><option value="O">조치 O</option><option value="X">조치 X</option><option value="-">조치 미입력</option></select>
      <input id="flt-q" type="search" placeholder="층, 실, 공사명 검색">
      <span class="count" id="count"></span>
      <button class="linkbtn" id="btn-refresh">새로고침</button>
    </div>
    <div id="list"></div>
  </section>
</div>

<div class="lb" id="lb" hidden>
  <div class="imgbox"><img id="lb-img" alt="" referrerpolicy="no-referrer"></div>
  <div class="bar">
    <div class="info" id="lb-info"></div>
    <div class="btns">
      <div class="act" id="lb-act"><span class="act-label">조치</span><button class="ox ox-O" data-act="O">O</button><button class="ox ox-X" data-act="X">X</button></div>
      <a class="btn" id="lb-dl" target="_blank" rel="noopener">원본 열기</a>
      <button class="btn danger" id="lb-del" hidden>삭제</button>
      <button class="btn" id="lb-close">닫기</button>
    </div>
  </div>
</div>

<datalist id="dl-name"></datalist><datalist id="dl-dong"></datalist><datalist id="dl-floor"></datalist><datalist id="dl-work"></datalist><datalist id="dl-room"></datalist><datalist id="dl-note"></datalist>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
