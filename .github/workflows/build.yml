name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          TASK=assembleRelease; OUT=release/app-release.apk
          if [ -z "$KEYSTORE_PASSWORD" ]; then TASK=assembleDebug; OUT=debug/app-debug.apk; fi
          set +e
          gradle -p android $TASK -PappUrl="https://${OWNER}.github.io/${REPO}/" -PversionCode=${{ github.run_number }} --no-daemon --console=plain > build.log 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            { echo '빌드 실패 로그 (마지막 80줄)'; echo '```'; grep -v '^\s*$' build.log | tail -80; echo '```'; } > comment.md
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md > /dev/null
            exit 1
          fi
          cp android/app/build/outputs/apk/$OUT "SitePhotoBoard-v${{ github.run_number }}.apk"
          echo "$TASK" > build-type.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "*.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" *.apk --title "현장보드판 v${{ github.run_number }}" --notes "휴대폰에서 APK 파일을 받아 설치하세요. (build: $(cat build-type.txt))" --latest
